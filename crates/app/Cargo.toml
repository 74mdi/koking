[package]
name = "signal-alt"
version = "0.1.6"
edition = "2021"
description = "Koking — private messenger"
license = "MIT"
repository = "https://github.com/74mdi/koking"

[package.metadata.deb]
name = "koking"
maintainer = "74mdi <97978397+74mdi@users.noreply.github.com>"
section = "net"
depends = "$auto, libwebkit2gtk-4.1-0"
assets = [
    "$auto",
    ["assets/koking.desktop", "usr/share/applications/koking.desktop", "644"],
]

[dependencies]
dioxus = { version = "0.6.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-timer = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "signal-alt"
path = "src/main.rs"
