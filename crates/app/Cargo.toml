[package]
name = "signal-alt"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.5" }

dioxus-desktop = { version = "0.5", optional = true }

[features]
desktop = ["dioxus-desktop", "dioxus/desktop"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "signal-alt"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
