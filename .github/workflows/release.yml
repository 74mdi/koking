name: Build Signal Alt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-s"

jobs:
  # ---------- Desktop ----------
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-4.0

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install webkit2gtk 2>/dev/null || true

      - name: Install Windows deps
        if: runner.os == 'Windows'
        run: |
          # WebView2 is built-in on Windows 10/11; ensure cargo config for MSVC
          echo "WebView2 runtime is included in Windows SDK"

      - name: Build release (desktop)
        run: cargo build --release --package signal-alt

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: signal-alt-desktop-${{ matrix.os }}
          path: target/release/signal-alt*
          if-no-files-found: warn

  # ---------- Android ----------
  android:
    runs-on: ubuntu-latest
    needs: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install Android SDK/NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build Android APK (release)
        run: cargo apk build --release --package signal-alt --target aarch64-linux-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signal-alt-android
          path: target/aarch64-linux-android/release/*.apk
          if-no-files-found: warn
