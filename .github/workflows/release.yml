name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: windows-latest
            target: ''
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Swatinem rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Build release
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release -p signal-alt --features desktop --target ${{ matrix.target }}
          else
            cargo build --release -p signal-alt --features desktop
          fi

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            BIN="target/${{ matrix.target }}/release/signal-alt"
          else
            BIN="target/release/signal-alt"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="${BIN}.exe"
            cp "$BIN" "dist/signal-alt-${{ matrix.artifact }}.exe"
            python -m zipfile -c "dist/signal-alt-${{ matrix.artifact }}.zip" "dist/signal-alt-${{ matrix.artifact }}.exe"
          else
            cp "$BIN" "dist/signal-alt-${{ matrix.artifact }}"
            tar czf "dist/signal-alt-${{ matrix.artifact }}.tar.gz" "dist/signal-alt-${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-alt-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [desktop, debian]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

  debian:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld \
            dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Swatinem rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: debian-trixie

      - name: Build Debian package
        run: |
          cargo build --release -p signal-alt --features desktop
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb --no-build -p signal-alt
          cp target/debian/signal-alt_*.deb dist/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: signal-alt-debian-amd64
          path: dist/*.deb
          if-no-files-found: error
